spring.application.name=personal-finance

# personal-finance.sqlite.url is required and intentionally has no default here.
# Provide it at startup, for example:
#   PERSONAL_FINANCE_SQLITE_URL=jdbc:sqlite:/path/to/personal-finance.db mvn spring-boot:run
#   java -jar personal-finance.jar --personal-finance.sqlite.url=jdbc:sqlite:/path/to/personal-finance.db
# Both PERSONAL_FINANCE_SQLITE_URL and Spring's canonical PERSONALFINANCE_SQLITE_URL bind this property
# (verified with Spring Boot 4.1.1).
# The database schema is not created automatically; the database must already be initialized.
