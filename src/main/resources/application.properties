spring.application.name=personal-finance

# personal-finance.sqlite.url is required and intentionally has no default here.
# Provide it at startup, for example:
#   PERSONAL_FINANCE_SQLITE_URL=jdbc:sqlite:/path/to/personal-finance.db mvn spring-boot:run
#   java -jar personal-finance.jar --personal-finance.sqlite.url=jdbc:sqlite:/path/to/personal-finance.db
# Both PERSONAL_FINANCE_SQLITE_URL and Spring's canonical PERSONALFINANCE_SQLITE_URL bind this property
# (verified with Spring Boot 4.1.1).
# The database schema is not created automatically; the database must already be initialized.

# personal-finance.single-user-id is required and intentionally has no default here.
# Single-user mode: every request belongs to this user (no authentication yet). It must be a UUID
# that already exists in the users table, inserted by hand (lowercase) when the database is initialized:
#   sqlite3 /path/to/personal-finance.db "INSERT INTO users (id) VALUES (lower('<uuid>'));"
# Provide it at startup, for example via PERSONAL_FINANCE_SINGLE_USER_ID=<uuid>.
# Anyone who can reach the server port has full access: do not expose it beyond your machine or LAN.

# personal-finance.time-zone decides what "today" is for the user (default America/Mexico_City).
# Override it with PERSONAL_FINANCE_TIME_ZONE or --personal-finance.time-zone=<zone id>.

# Dates in path variables and query parameters use ISO-8601 (2026-10-04).
spring.mvc.format.date=iso

# Strict JSON request bodies (Jackson 3 DeserializationFeature): reject unknown properties and
# reject floating-point numbers (e.g. 10.5) for integer fields such as amounts in cents.
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
